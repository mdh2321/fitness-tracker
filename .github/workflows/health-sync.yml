name: Health sync checks
on:
  push:
    paths: ['ios/**', 'src/**', 'tests/**', 'scripts/test-sync.mjs', 'package*.json', '.github/workflows/health-sync.yml']
  pull_request:
    paths: ['ios/**', 'src/**', 'tests/**', 'scripts/test-sync.mjs', 'package*.json', '.github/workflows/health-sync.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:sync
      - run: npx tsc --noEmit
  iphone:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test aggregation and date handling
        run: swift test --package-path ios
      - name: Build iPhone companion without signing
        run: xcodebuild -project ios/ARCHealth.xcodeproj -scheme ARCHealth -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
