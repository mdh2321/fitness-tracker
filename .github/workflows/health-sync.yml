name: Health sync checks
on:
  push:
    paths: ['ios/**', 'src/**', 'tests/**', 'scripts/test-sync.mjs', 'package*.json', '.github/workflows/health-sync.yml']
  pull_request:
    paths: ['ios/**', 'src/**', 'tests/**', 'scripts/test-sync.mjs', 'package*.json', '.github/workflows/health-sync.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:sync
      - run: npx tsc --noEmit
  iphone:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test aggregation and date handling
        run: swift test --package-path ios
      - name: Build iPhone companion without signing
        run: xcodebuild -project ios/ARCHealth.xcodeproj -scheme ARCHealth -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/arc-ios CODE_SIGNING_ALLOWED=NO build
      - name: Capture the connection screen
        run: |
          arc_sim_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$arc_sim_id"
          xcrun simctl bootstatus "$arc_sim_id" -b
          xcrun simctl install "$arc_sim_id" /tmp/arc-ios/Build/Products/Debug-iphonesimulator/ARCHealth.app
          xcrun simctl launch "$arc_sim_id" com.mdh2321.arc.health
          sleep 3
          xcrun simctl io "$arc_sim_id" screenshot /tmp/arc-connection.png
      - uses: actions/upload-artifact@v4
        with:
          name: arc-connection-preview
          path: /tmp/arc-connection.png
